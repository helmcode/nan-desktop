name: Release

# Builds installers for the 3 desktop OSes on a vX.Y.Z tag and fills a DRAFT
# GitHub release with the artifacts (publishing stays a human decision).
#
#   macOS arm64  -> dmg + .app.tar.gz  (aarch64-apple-darwin)
#   macOS x64    -> dmg + .app.tar.gz  (x86_64-apple-darwin, cross-compiled)
#   Windows      -> msi + nsis exe
#   Linux        -> AppImage + deb + rpm
#
# Code signing (see SIGNING.md) turns itself on when the secrets exist:
#
#   macOS    APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD + notary creds
#            (APPLE_API_ISSUER/APPLE_API_KEY_ID/APPLE_API_KEY) -> Developer ID
#            signature + hardened runtime + notarization + stapling.
#            Without them: ad-hoc bundle seal (verifies, but Gatekeeper still
#            blocks quarantined downloads).
#   Windows  WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD -> Authenticode
#            on the app exe, the setup exe and the msi. Without: unsigned.
#   Updater  TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#            (minisign key, see SIGNING.md "Auto-update") -> every updater
#            artifact gets a .sig and rename-assets publishes a signed
#            latest.json (the in-app "Update" banner feed). Without: no
#            latest.json, installed apps simply see no update.
#
# The release body and each job summary state which path was taken.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # Creates (or reuses, on re-runs) the draft release up front so the build
    # jobs upload into ONE release, and writes an honest signing statement.
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      updater-signed: ${{ steps.release.outputs.updater-signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Guard: tag version matches the manifests"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          grep -q "\"version\": \"$tag\"" src-tauri/tauri.conf.json || { echo "::error::src-tauri/tauri.conf.json version != $tag"; fail=1; }
          grep -q "^version = \"$tag\"" src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml version != $tag"; fail=1; }
          grep -q "\"version\": \"$tag\"" package.json || { echo "::error::package.json version != $tag"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
      - name: Create or reuse draft release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          UPDATER_SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && ((secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_KEY != '') || (secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '')) }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          {
            echo "Installers for Windows (msi / setup exe), macOS (dmg, Apple Silicon and Intel) and Linux (AppImage / deb / rpm)."
            echo
            echo "### Code signing status"
            echo
            if [ "$MACOS_SIGNED" = "true" ]; then
              echo "- **macOS:** signed with an Apple Developer ID and notarized by Apple. Open the dmg and drag the app to Applications."
            else
              echo "- **macOS:** NOT signed with an Apple Developer ID and NOT notarized yet (the bundle carries an ad-hoc signature only). macOS will say the app \"is damaged and can't be opened\" or \"cannot be verified\". After dragging it to Applications, run once in Terminal:"
              echo
              echo '  ```sh'
              echo '  xattr -cr "/Applications/Helmcode Desktop.app"'
              echo '  ```'
              echo
              echo "  This only removes the download quarantine flag from this app. Developer ID signing + notarization is in progress."
            fi
            if [ "$WINDOWS_SIGNED" = "true" ]; then
              echo "- **Windows:** Authenticode-signed. SmartScreen may still warn on the first releases until the certificate builds reputation (\"More info\" -> \"Run anyway\")."
            else
              echo "- **Windows:** NOT code-signed yet. SmartScreen will show \"Windows protected your PC\": click \"More info\" -> \"Run anyway\"."
            fi
            echo "- **Linux:** packages are not signed (standard for AppImage/deb/rpm from GitHub releases)."
            echo
            echo "Verify the SHA-256 of your download against the value GitHub shows next to each asset before installing. See [SIGNING.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SIGNING.md) and [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md)."
          } > "$body"

          # /releases/tags/{tag} does not return drafts, so search the list.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="nan-desktop $TAG" \
                   -F draft=true -F prerelease=false -F body=@"$body" --jq .id)
            echo "created draft release $id"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@"$body" >/dev/null
            echo "reusing release $id (body refreshed)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "updater-signed=$UPDATER_SIGNED" >> "$GITHUB_OUTPUT"
          {
            echo "### Signing plan for $TAG"
            echo "- macOS: $([ "$MACOS_SIGNED" = true ] && echo 'Developer ID + notarization' || echo 'ad-hoc fallback (no Apple secrets)')"
            echo "- Windows: $([ "$WINDOWS_SIGNED" = true ] && echo 'Authenticode' || echo 'unsigned (no certificate secret)')"
            echo "- Auto-update feed: $([ "$UPDATER_SIGNED" = true ] && echo 'signed latest.json' || echo 'OFF (no TAURI_SIGNING_PRIVATE_KEY secret): installed apps see no update')"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust-target: ''
          - os: windows-latest
            args: ''
            rust-target: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Add Rust target (macOS cross-compile)
        if: matrix.rust-target != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      # ----------------------------------------------- Windows + Linux ----
      # One build-config overlay for both:
      # - Windows + certificate secret: register scripts/windows-sign.ps1 as
      #   Tauri's signCommand so the app exe AND both installers get signed
      #   during bundling. Without it, the build is unsigned.
      # - Updater key secret: createUpdaterArtifacts, so the bundler writes a
      #   minisign .sig next to every installer (uploaded with it). Kept out
      #   of tauri.conf.json so local builds never need the private key.
      #   (macOS signs its re-packed .app.tar.gz itself after the Apple
      #   signature, see the macOS upload step.)
      - name: Configure build overlay (Windows / Linux)
        id: overlay
        if: runner.os != 'macOS'
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_UPDATER_KEY: ${{ needs.prepare.outputs.updater-signed }}
        run: |
          $bundle = @{}
          if ($env:RUNNER_OS -eq 'Windows') {
            if ($env:HAS_CERT -eq 'true') {
              $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-sign.ps1'
              $bundle.windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-File', $script, '%1') } }
              "mode=authenticode" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            } else {
              "mode=unsigned" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            }
          }
          if ($env:HAS_UPDATER_KEY -eq 'true') { $bundle.createUpdaterArtifacts = $true }
          if ($bundle.Count -gt 0) {
            $path = Join-Path $env:RUNNER_TEMP 'tauri.release-overlay.json'
            @{ bundle = $bundle } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $path
            Get-Content $path
            "config-arg=--config `"$path`"" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      # ------------------------------------------- Windows + Linux build ----
      - name: Build and upload to draft release (Windows / Linux)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          # Updater signatures (.sig) when the overlay enabled them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.args }} ${{ steps.overlay.outputs.config-arg }}
          # latest.json is built by rename-assets AFTER the stable rename
          # (tauri-action's own one would point at the versioned names).
          includeUpdaterJson: false

      - name: Verify Authenticode signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MODE: ${{ steps.overlay.outputs.mode }}
        run: |
          $files = @(Get-ChildItem -Path 'src-tauri\target\release\bundle' -Recurse -Include *.msi, *-setup.exe)
          $files += @(Get-ChildItem -Path 'src-tauri\target\release' -Filter *.exe -File)
          if (-not $files) { throw 'no Windows artifacts found' }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host ("{0}: {1} {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($env:MODE -eq 'authenticode' -and $sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad artifact(s) are not validly signed" }
          if ($env:MODE -eq 'authenticode') {
            "- Windows: **Authenticode-signed** (exe + setup exe + msi verified)." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            "- Windows: **unsigned fallback** (no WINDOWS_CERTIFICATE secret); SmartScreen will warn. See SIGNING.md." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      # --------------------------------------------------------- macOS ----
      # Build only (no upload): the dmg must be repacked with the signed app
      # before it is published, so signing and upload happen in the next steps.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07
        with:
          args: ${{ matrix.args }}

      - name: Sign, notarize and verify (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          app="$bundle/macos/Helmcode Desktop.app"
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one dmg, found: ${dmgs[*]:-none}"; exit 1; }
          bash scripts/macos-sign.sh "$app" "${dmgs[0]}"
          echo "dmg=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Upload to draft release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          DMG: ${{ steps.macsign.outputs.dmg }}
          APP: ${{ steps.macsign.outputs.app }}
          UPDATER_SIGNED: ${{ needs.prepare.outputs.updater-signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/upload"
          mkdir -p "$out"
          # GitHub turns spaces into dots in asset names; do it explicitly so
          # the rename job sees predictable names.
          dmg_name=$(basename "$DMG" | tr ' ' '.')
          arch=$(echo "$dmg_name" | sed -E 's/.*_([^_]+)\.dmg$/\1/')
          tar_name="Helmcode.Desktop_${arch}.app.tar.gz"
          cp "$DMG" "$out/$dmg_name"
          # The updater payload is the SIGNED (and notarized/stapled) app.
          # AppleDouble (._*) entries would be written into the bundle by the
          # updater's tar extractor and invalidate the signature of the UPDATED
          # app: strip macOS metadata + extended attributes (Opus review, B3).
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "$out/$tar_name" -C "$(dirname "$APP")" "$(basename "$APP")"
          files=("$out/$dmg_name" "$out/$tar_name")
          if [ "$UPDATER_SIGNED" = "true" ]; then
            # minisign signature for the auto-updater (reads the key and its
            # password from TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
            pnpm tauri signer sign "$out/$tar_name"
            [ -s "$out/$tar_name.sig" ] || { echo "updater signature missing"; exit 1; }
            files+=("$out/$tar_name.sig")
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            # Re-runs: replace an asset with the same name.
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
                    --jq ".[] | select(.name == \"$name\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X POST -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              --input "$f" --jq .name
          done

  rename-assets:
    # Stable asset names: every release ships the SAME file names, so
    # https://github.com/helmcode/nan-desktop/releases/latest/download/<name>
    # is a permanent one-click URL for the latest stable build (the landings
    # and the docs link these; do not add versions back). Uploads use
    # versioned names; this job renames them via the API.
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets to stable names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          set -e
          rid="$RELEASE_ID"
          rename_asset() { gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$1" -f name="$2" --jq .name; }
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --paginate --jq '.[].id'); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --jq .name)
            case "$n" in
              # Updater signatures follow their installer's stable name.
              *aarch64.app.tar.gz.sig) rename_asset "$id" "Helmcode.Desktop-macOS-AppleSilicon.app.tar.gz.sig" ;;
              *x64.app.tar.gz.sig)    rename_asset "$id" "Helmcode.Desktop-macOS-Intel.app.tar.gz.sig" ;;
              *x64_en-US.msi.sig)     rename_asset "$id" "Helmcode.Desktop-Windows-x64.msi.sig" ;;
              *x64-setup.exe.sig)     rename_asset "$id" "Helmcode.Desktop-Windows-x64-setup.exe.sig" ;;
              *amd64.deb.sig)         rename_asset "$id" "Helmcode.Desktop-Linux-amd64.deb.sig" ;;
              *amd64.AppImage.sig)    rename_asset "$id" "Helmcode.Desktop-Linux-amd64.AppImage.sig" ;;
              *x86_64.rpm.sig)        rename_asset "$id" "Helmcode.Desktop-Linux-x86_64.rpm.sig" ;;
              *aarch64*.dmg)          rename_asset "$id" "Helmcode.Desktop-macOS-AppleSilicon.dmg" ;;
              *x64*.dmg)              rename_asset "$id" "Helmcode.Desktop-macOS-Intel.dmg" ;;
              *aarch64.app.tar.gz)    rename_asset "$id" "Helmcode.Desktop-macOS-AppleSilicon.app.tar.gz" ;;
              *x64.app.tar.gz)        rename_asset "$id" "Helmcode.Desktop-macOS-Intel.app.tar.gz" ;;
              *x64_en-US.msi)         rename_asset "$id" "Helmcode.Desktop-Windows-x64.msi" ;;
              *x64-setup.exe)         rename_asset "$id" "Helmcode.Desktop-Windows-x64-setup.exe" ;;
              *amd64.deb)             rename_asset "$id" "Helmcode.Desktop-Linux-amd64.deb" ;;
              *amd64.AppImage)        rename_asset "$id" "Helmcode.Desktop-Linux-amd64.AppImage" ;;
              *x86_64.rpm)            rename_asset "$id" "Helmcode.Desktop-Linux-x86_64.rpm" ;;
            esac
          done
          echo "final names:"
          gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --paginate --jq '.[].name'

      # Auto-update feed. Built AFTER the rename so every URL is a stable
      # name under this tag; each platform entry inlines the minisign
      # signature of its installer. Fails (instead of publishing a partial
      # feed) when a required signature is missing. Goes live for installed
      # apps when this draft is PUBLISHED (releases/latest/download/...).
      - name: Checkout (updater manifest script)
        if: needs.prepare.outputs.updater-signed == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Build and upload latest.json
        if: needs.prepare.outputs.updater-signed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rid="$RELEASE_ID"
          sigs="$RUNNER_TEMP/sigs"
          mkdir -p "$sigs"
          gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$sigs/$name"
          done
          manifest="$RUNNER_TEMP/latest.json"
          node scripts/updater-manifest.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --sigs "$sigs" --out "$manifest" \
            --notes "Helmcode Desktop $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --paginate \
                  --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          gh api -X POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=latest.json" \
            --input "$manifest" --jq .name
          echo "- Auto-update: **signed latest.json** uploaded (live once the release is published)." >> "$GITHUB_STEP_SUMMARY"

name: Release dry-run

# Nightly (and on demand) rehearsal of the release pipeline WITHOUT any
# secret and WITHOUT touching GitHub releases: full `tauri build` on the 4
# release targets, the macOS ad-hoc seal, the stable asset naming of
# release.yml's rename-assets, and the signed latest.json generation, all
# against local files signed with a THROWAWAY minisign key generated in the
# run. Catches a broken release path days before a tag needs it.
#
# Output: one workflow artifact per target (installers + .sig) and
# `release-dryrun` (stable names + latest.json). The throwaway key never
# leaves its job; its signatures are worthless outside this run (the
# shipped apps only trust the real public key in tauri.conf.json).

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dryrun
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            artifact: macos-x64
          - os: ubuntu-22.04
            args: ''
            rust-target: ''
            artifact: linux
          - os: windows-latest
            args: ''
            rust-target: ''
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      STAGE: release-stage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Add Rust target (macOS cross-compile)
        if: matrix.rust-target != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      # Same split as release.yml on Windows (compile, then `tauri bundle`),
      # so the dry-run exercises the exact commands the release runs.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm tauri build --ci --no-bundle ${{ matrix.args }}
            pnpm tauri bundle --ci
          else
            pnpm tauri build --ci ${{ matrix.args }}
          fi

      - name: Ad-hoc seal and dmg repack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_FORCE_ADHOC: '1'
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one dmg, found: ${dmgs[*]:-none}"; exit 1; }
          bash scripts/macos-sign.sh "$bundle/macos/Helmcode Desktop.app" "${dmgs[0]}"

      # Same staging (and therefore the same pre-rename names) as release.yml.
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          shopt -s nullglob
          case "$RUNNER_OS" in
            macOS)
              bundle="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
              dmgs=("$bundle"/dmg/*.dmg)
              dmg_name=$(basename "${dmgs[0]}" | tr ' ' '.')
              arch=$(echo "$dmg_name" | sed -E 's/.*_([^_]+)\.dmg$/\1/')
              cp "${dmgs[0]}" "$STAGE/$dmg_name"
              COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "$STAGE/Helmcode.Desktop_${arch}.app.tar.gz" \
                -C "$bundle/macos" "Helmcode Desktop.app"
              ;;
            Windows)
              bundle="src-tauri/target/release/bundle"
              files=("$bundle"/msi/*.msi "$bundle"/nsis/*-setup.exe)
              [ "${#files[@]}" -eq 2 ] || { echo "expected 2 installers, found: ${files[*]:-none}"; exit 1; }
              for f in "${files[@]}"; do cp "$f" "$STAGE/$(basename "$f" | tr ' ' '.')"; done
              ;;
            Linux)
              bundle="src-tauri/target/release/bundle"
              files=("$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm)
              [ "${#files[@]}" -eq 3 ] || { echo "expected 3 installers, found: ${files[*]:-none}"; exit 1; }
              for f in "${files[@]}"; do cp "$f" "$STAGE/$(basename "$f" | tr ' ' '.')"; done
              ;;
          esac
          ls -la "$STAGE"

      # Throwaway minisign key, generated here and never uploaded: exercises
      # the exact `tauri signer sign --app-version` call of the release's
      # updater-signing steps with no secret involved.
      - name: Sign updater bundles with a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          keydir=$(mktemp -d)
          pnpm tauri signer generate --ci -w "$keydir/dryrun.key" -p dryrun
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$keydir/dryrun.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=dryrun
          version=$(node -p 'require("./package.json").version')
          shopt -s nullglob
          for f in "$STAGE"/*.app.tar.gz "$STAGE"/*.msi "$STAGE"/*-setup.exe "$STAGE"/*.AppImage "$STAGE"/*.deb "$STAGE"/*.rpm; do
            pnpm tauri signer sign "$f" --app-version "$version"
            [ -s "$f.sig" ] || { echo "updater signature missing for $f"; exit 1; }
          done

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dryrun-${{ matrix.artifact }}
          path: ${{ env.STAGE }}
          if-no-files-found: error
          retention-days: 5

  manifest:
    # Local equivalent of release.yml rename-assets: stable names, then the
    # signed latest.json from scripts/updater-manifest.mjs.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dryrun-*
          path: assets
          merge-multiple: true

      - name: Apply the stable release names
        run: |
          set -euo pipefail
          cd assets
          # Keep in sync with the rename-assets case table of release.yml.
          for n in *; do
            case "$n" in
              *aarch64.app.tar.gz.sig) to="Helmcode.Desktop-macOS-AppleSilicon.app.tar.gz.sig" ;;
              *x64.app.tar.gz.sig)    to="Helmcode.Desktop-macOS-Intel.app.tar.gz.sig" ;;
              *x64_en-US.msi.sig)     to="Helmcode.Desktop-Windows-x64.msi.sig" ;;
              *x64-setup.exe.sig)     to="Helmcode.Desktop-Windows-x64-setup.exe.sig" ;;
              *amd64.deb.sig)         to="Helmcode.Desktop-Linux-amd64.deb.sig" ;;
              *amd64.AppImage.sig)    to="Helmcode.Desktop-Linux-amd64.AppImage.sig" ;;
              *x86_64.rpm.sig)        to="Helmcode.Desktop-Linux-x86_64.rpm.sig" ;;
              *aarch64*.dmg)          to="Helmcode.Desktop-macOS-AppleSilicon.dmg" ;;
              *x64*.dmg)              to="Helmcode.Desktop-macOS-Intel.dmg" ;;
              *aarch64.app.tar.gz)    to="Helmcode.Desktop-macOS-AppleSilicon.app.tar.gz" ;;
              *x64.app.tar.gz)        to="Helmcode.Desktop-macOS-Intel.app.tar.gz" ;;
              *x64_en-US.msi)         to="Helmcode.Desktop-Windows-x64.msi" ;;
              *x64-setup.exe)         to="Helmcode.Desktop-Windows-x64-setup.exe" ;;
              *amd64.deb)             to="Helmcode.Desktop-Linux-amd64.deb" ;;
              *amd64.AppImage)        to="Helmcode.Desktop-Linux-amd64.AppImage" ;;
              *x86_64.rpm)            to="Helmcode.Desktop-Linux-x86_64.rpm" ;;
              *) echo "::error::no stable name for $n (rename-assets would leave it versioned)"; exit 1 ;;
            esac
            mv -- "$n" "$to"
          done
          ls -la
          # Every stable installer name the landings and the docs link.
          for r in Helmcode.Desktop-macOS-AppleSilicon.dmg Helmcode.Desktop-macOS-Intel.dmg \
                   Helmcode.Desktop-Windows-x64.msi Helmcode.Desktop-Windows-x64-setup.exe \
                   Helmcode.Desktop-Linux-amd64.AppImage Helmcode.Desktop-Linux-amd64.deb \
                   Helmcode.Desktop-Linux-x86_64.rpm; do
            [ -f "$r" ] || { echo "::error::missing $r"; exit 1; }
          done

      - name: Build latest.json (refuses a partial feed)
        run: |
          set -euo pipefail
          tag="v$(jq -er .version package.json)"
          node scripts/updater-manifest.mjs --tag "$tag" --repo "$GITHUB_REPOSITORY" \
            --sigs assets --out assets/latest.json --notes "dry-run $tag (throwaway key)"
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64")
                 and has("windows-x86_64-msi") and has("linux-x86_64")' assets/latest.json
          {
            echo "### Release dry-run $tag"
            echo "- 4 targets built, staged, renamed to the stable names."
            echo "- latest.json platforms: $(jq -r '.platforms | keys | join(", ")' assets/latest.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry-run release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dryrun
          path: assets
          if-no-files-found: error
          retention-days: 5

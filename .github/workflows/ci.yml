name: CI

# Frontend build + Rust checks (fmt, clippy, tests) on the 3 desktop OSes.
# Also validates the Linux WebKitGTK build path used by the release pipeline.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Tauri on Linux links against the system WebKitGTK stack; CI is where the
      # Linux path is validated (no Linux machine in the usual dev setup).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Frontend build (typecheck + vite)
        run: pnpm build

      # Advisory dependency audit (prod deps only). Fails on high+ severity;
      # lower levels are informational. Rust-side auditing (cargo-audit /
      # cargo-deny) is a documented MANUAL step for now — see the README
      # security section.
      - name: Dependency audit (prod, fail on high+)
        if: runner.os == 'Linux'
        run: pnpm audit --prod --audit-level high

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend tests (vitest)
        run: pnpm test

      # Acceptance checks: assert the pinned tests actually RAN and passed
      # (a renamed/filtered test must not silently drop coverage), plus the
      # round-4 image/auto-open end-to-end flows over mocks.
      - name: Wire check (t8)
        run: node test/t8-check.mjs

      - name: Round-4 E2E check (t14)
        run: node test/t14-check.mjs

      # Round 7: signed auto-update wiring (real pubkey + endpoint, core-only
      # plugin use, latest.json builder, release rename/sign/publish steps).
      - name: Auto-update wiring check
        run: node test/updater-check.mjs

      # Release signing scripts: lint everywhere they can be linted, and run
      # the macOS seal spec (reproduces the "damaged app" defect and proves
      # the ad-hoc fallback repairs both the .app and the app inside the dmg).
      - name: Lint signing scripts (shellcheck)
        if: runner.os == 'Linux'
        run: shellcheck scripts/macos-sign.sh test/macos-sign-test.sh scripts/updater-keygen.sh

      - name: Lint signing scripts (PowerShell parse)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\windows-sign.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: macOS signing spec (ad-hoc seal + dmg repack)
        if: runner.os == 'macOS'
        run: bash test/macos-sign-test.sh

  # The Intel macOS release leg is cross-compiled on an Apple Silicon runner
  # and was never tested. Run the Rust suite for x86_64-apple-darwin once per
  # push/PR; the test binaries execute under Rosetta 2.
  rust-macos-x86_64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds ../dist, so the frontend must exist.
      - name: Frontend build
        run: pnpm build

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: x86_64-apple-darwin

      - name: Ensure Rosetta 2 and the x86_64 target
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          rustup target add x86_64-apple-darwin

      - name: Rust tests (x86_64-apple-darwin under Rosetta)
        working-directory: src-tauri
        run: cargo test --target x86_64-apple-darwin

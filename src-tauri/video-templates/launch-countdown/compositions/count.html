<template id="count-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; }
    .count-stage { position: absolute; inset: 0; }
    .count-glow { position: absolute; left: 50%; top: 50%; width: 120vmin; height: 120vmin; margin: -60vmin 0 0 -60vmin; border-radius: 50%; background: radial-gradient(circle, var(--accent-2) 0%, transparent 60%); opacity: 0.3; animation: count-breathe 3.6s ease-in-out both; }
    .count-teaser { position: absolute; left: 6vmin; right: 6vmin; bottom: 8vmin; margin: 0; text-align: center; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 3.2vmin; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; animation: count-type 1.2s steps(32) 0.2s both; }
    .count-progress { position: absolute; left: 0; top: 0; height: 0.8vmin; width: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transform-origin: left center; animation: count-progress 3.6s linear both; }
    .count-ring { position: absolute; left: 50%; top: 50%; width: 56vmin; height: 56vmin; margin: -28vmin 0 0 -28vmin; border-radius: 50%; background: conic-gradient(var(--accent) 0turn, var(--accent) 1turn); -webkit-mask: radial-gradient(circle, transparent 64%, #000 65%); mask: radial-gradient(circle, transparent 64%, #000 65%); animation: count-sweep 1.2s linear both; }
    .count-track { position: absolute; left: 50%; top: 50%; width: 56vmin; height: 56vmin; margin: -28vmin 0 0 -28vmin; border-radius: 50%; border: 1vmin solid var(--fg); opacity: 0.12; }
    .count-digit { position: absolute; left: 0; right: 0; top: 50%; height: 36vmin; margin-top: -18vmin; text-align: center; font-size: 36vmin; font-weight: 900; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; animation: count-digit 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .count-ring-2, .count-digit-2 { animation-delay: 1.2s; }
    .count-ring-1, .count-digit-1 { animation-delay: 2.4s; }
    @keyframes count-breathe { 0% { transform: scale(0.8); opacity: 0.15; } 100% { transform: scale(1.3); opacity: 0.45; } }
    @keyframes count-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes count-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes count-sweep { 0% { opacity: 1; clip-path: polygon(50% 50%, 50% 0, 50% 0, 50% 0, 50% 0, 50% 0, 50% 0); } 21% { clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 50%, 100% 50%, 100% 50%, 100% 50%); } 42% { clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 50% 100%, 50% 100%, 50% 100%); } 63% { clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 0 100%, 0 50%, 0 50%); } 84% { opacity: 1; clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 0 100%, 0 0, 50% 0); } 100% { opacity: 0; clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 0 100%, 0 0, 50% 0); } }
    @keyframes count-digit { 0% { opacity: 0; transform: scale(1.6); filter: blur(2vmin); } 20% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; transform: scale(0.96); filter: blur(0); } 100% { opacity: 0; transform: scale(0.7); filter: blur(1vmin); } }
    @media (max-aspect-ratio: 3/4) {
      .count-digit { font-size: 44vmin; height: 44vmin; margin-top: -22vmin; }
      .count-ring, .count-track { width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; }
      .count-teaser { bottom: 18vmin; font-size: 3.8vmin; }
    }
  </style>
  <div id="root" data-composition-id="count" data-width="1920" data-height="1080">
    <div id="count-stage" class="clip count-stage" data-start="0" data-duration="3.6">
      <div id="count-glow" class="count-glow"></div>
      <div id="count-progress" class="count-progress"></div>
      <div id="count-track" class="count-track"></div>
      <div id="count-ring-3" class="count-ring count-ring-3"></div>
      <div id="count-ring-2" class="count-ring count-ring-2"></div>
      <div id="count-ring-1" class="count-ring count-ring-1"></div>
      <span id="count-3" class="count-digit count-digit-3">3</span>
      <span id="count-2" class="count-digit count-digit-2">2</span>
      <span id="count-1" class="count-digit count-digit-1">1</span>
      <p id="count-teaser" class="count-teaser" data-var-text="teaser">Algo nuevo está a punto de llegar</p>
    </div>
  </div>
</template>

<template id="reveal-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; }
    .reveal-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5vmin; padding: 0 8vmin; text-align: center; }
    .reveal-flash { position: absolute; inset: 0; background: var(--fg); animation: reveal-flash 0.7s ease-out both; }
    .reveal-sky { position: absolute; inset: -10%; background: radial-gradient(ellipse at 30% 30%, var(--accent-2) 0%, transparent 50%), radial-gradient(ellipse at 70% 75%, var(--accent) 0%, transparent 50%); opacity: 0.45; animation: reveal-sky 5s ease-out both; }
    .reveal-logo { position: relative; width: 14vmin; height: 14vmin; object-fit: contain; animation: reveal-drop 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.3s both; }
    .reveal-status { position: relative; margin: 0; padding: 1.4vmin 3.4vmin; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 3.4vmin; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; animation: reveal-pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) 0.6s both; }
    .reveal-name { position: relative; margin: 0; font-size: 19vmin; font-weight: 900; line-height: 0.95; letter-spacing: -0.05em; animation: reveal-name 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.75s both; }
    .reveal-date { position: relative; margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 4vmin; font-weight: 500; letter-spacing: 0.06em; animation: reveal-up 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s both; }
    .reveal-url { position: relative; margin: 0; font-size: 3.4vmin; font-weight: 400; letter-spacing: 0.04em; opacity: 0.75; animation: reveal-fade 0.7s ease 1.9s both; }
    @keyframes reveal-flash { from { opacity: 1; } to { opacity: 0; } }
    @keyframes reveal-sky { from { transform: scale(1.3) rotate(-8deg); } to { transform: scale(1) rotate(0deg); } }
    @keyframes reveal-drop { from { opacity: 0; transform: translateY(-8vmin) scale(0.6); } to { opacity: 1; transform: none; } }
    @keyframes reveal-pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
    @keyframes reveal-name { from { opacity: 0; transform: scale(0.8); letter-spacing: 0.1em; filter: blur(1.5vmin); } to { opacity: 1; transform: none; letter-spacing: -0.05em; filter: blur(0); } }
    @keyframes reveal-up { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 1; transform: none; } }
    @keyframes reveal-fade { from { opacity: 0; } to { opacity: 0.75; } }
    @media (max-aspect-ratio: 3/4) {
      .reveal-name { font-size: 16vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .reveal-stage { gap: 5vmin; }
      .reveal-name { font-size: 20vmin; }
      .reveal-logo { width: 18vmin; height: 18vmin; }
      .reveal-status { font-size: 4.2vmin; }
      .reveal-date { font-size: 4.8vmin; }
      .reveal-url { font-size: 4.2vmin; }
    }
  </style>
  <div id="root" data-composition-id="reveal" data-width="1920" data-height="1080">
    <div id="reveal-stage" class="clip reveal-stage" data-start="0" data-duration="5">
      <div id="reveal-sky" class="reveal-sky"></div>
      <img id="reveal-logo" class="reveal-logo" src="assets/logo.svg" data-var-src="logo" alt="">
      <p id="reveal-status" class="reveal-status" data-var-text="status">Ya disponible</p>
      <h1 id="reveal-name" class="reveal-name" data-var-text="product">Nova 2</h1>
      <p id="reveal-date" class="reveal-date" data-var-text="date">Desde el 12 de marzo</p>
      <p id="reveal-url" class="reveal-url" data-var-text="url">nova.app</p>
      <div id="reveal-flash" class="reveal-flash"></div>
    </div>
  </div>
</template>

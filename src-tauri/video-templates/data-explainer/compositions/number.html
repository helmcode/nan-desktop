<template id="number-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; }
    .number-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; padding: 0 8vmin; text-align: center; }
    .number-halo { position: absolute; left: 50%; top: 50%; width: 110vmin; height: 110vmin; margin: -55vmin 0 0 -55vmin; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, transparent 60%); opacity: 0.18; animation: number-halo 4.5s ease-out both; }
    .number-window { position: relative; height: 32vmin; overflow: hidden; }
    .number-reel { display: flex; flex-direction: column; animation: number-roll 1.6s cubic-bezier(0.15, 0.85, 0.25, 1) 0.2s both; }
    .number-value { display: block; height: 32vmin; font-size: 30vmin; font-weight: 900; line-height: 32vmin; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .number-value-ghost { opacity: 0.25; filter: blur(0.6vmin); }
    .number-final { color: var(--accent); }
    .number-label { position: relative; margin: 0; max-width: 120vmin; font-size: 5.5vmin; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; animation: number-up 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s both; }
    .number-rule { position: relative; width: 60vmin; max-width: 80vw; height: 0.6vmin; background: var(--muted); overflow: hidden; animation: number-up 0.5s ease 1.4s both; }
    .number-fill { position: absolute; inset: 0; background: var(--accent); transform-origin: left center; animation: number-fill 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 1.8s both; }
    @keyframes number-halo { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1.1); opacity: 0.18; } }
    @keyframes number-roll { from { transform: translateY(0); } to { transform: translateY(-96vmin); } }
    @keyframes number-up { from { opacity: 0; transform: translateY(4vmin); } to { opacity: 1; transform: none; } }
    @keyframes number-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (max-aspect-ratio: 3/4) {
      .number-label { font-size: 5.5vmin; max-width: 84vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .number-stage { gap: 5vmin; }
      .number-label { font-size: 7vmin; }
    }
  </style>
  <div id="root" data-composition-id="number" data-width="1920" data-height="1080">
    <div id="number-stage" class="clip number-stage" data-start="0" data-duration="4.5">
      <div id="number-halo" class="number-halo"></div>
      <div id="number-window" class="number-window">
        <div id="number-reel" class="number-reel">
          <span class="number-value number-value-ghost" data-var-text="stat">62%</span>
          <span class="number-value number-value-ghost" data-var-text="stat">62%</span>
          <span class="number-value number-value-ghost" data-var-text="stat">62%</span>
          <span class="number-value number-final" data-var-text="stat">62%</span>
        </div>
      </div>
      <div id="number-rule" class="number-rule"><div id="number-fill" class="number-fill"></div></div>
      <p id="number-label" class="number-label" data-var-text="stat-label">menos horas dedicadas a informes</p>
    </div>
  </div>
</template>

<template id="question-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; }
    .question-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--muted) 1px, transparent 1px), linear-gradient(90deg, var(--muted) 1px, transparent 1px); background-size: 8vmin 8vmin; opacity: 0.35; animation: question-grid 3.5s ease-out both; }
    .question-stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 5vmin; padding: 0 12vmin; }
    .question-kicker { display: flex; align-items: center; gap: 2vmin; margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 3.2vmin; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); animation: question-type 0.8s steps(18) 0.2s both; }
    .question-dot { width: 2vmin; height: 2vmin; border-radius: 50%; background: var(--accent); }
    .question-text { margin: 0; max-width: 130vmin; font-size: 8.5vmin; font-weight: 700; line-height: 1.08; letter-spacing: -0.03em; animation: question-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both; }
    .question-line { width: 30vmin; height: 0.8vmin; background: var(--accent); transform-origin: left center; animation: question-line 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s both; }
    @keyframes question-grid { from { opacity: 0; transform: scale(1.15); } to { opacity: 0.35; transform: scale(1); } }
    @keyframes question-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes question-rise { from { opacity: 0; transform: translateY(5vmin); filter: blur(1vmin); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes question-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (max-aspect-ratio: 3/4) {
      .question-stage { padding: 0 7vmin; }
      .question-text { font-size: 7.5vmin; max-width: 86vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .question-text { font-size: 9vmin; }
    }
  </style>
  <div id="root" data-composition-id="question" data-width="1920" data-height="1080">
    <div id="question-stage" class="clip question-stage" data-start="0" data-duration="3.5">
      <div id="question-grid" class="question-grid"></div>
      <p id="question-kicker" class="question-kicker"><span class="question-dot"></span><span data-var-text="kicker">Dato de la semana</span></p>
      <h1 id="question-text" class="question-text" data-var-text="question">¿Cuánto tiempo ahorra un equipo al automatizar sus informes?</h1>
      <div id="question-line" class="question-line"></div>
    </div>
  </div>
</template>

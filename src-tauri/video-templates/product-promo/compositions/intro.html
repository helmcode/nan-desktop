<template id="intro-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; }
    .intro-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin; }
    .intro-glow { position: absolute; left: 50%; top: 50%; width: 90vmin; height: 90vmin; margin: -45vmin 0 0 -45vmin; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, transparent 62%); opacity: 0.35; animation: intro-glow 3s ease-out both; }
    .intro-logo { width: 16vmin; height: 16vmin; object-fit: contain; animation: intro-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
    .intro-kicker { font-size: 3vmin; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: var(--accent); animation: intro-fade 0.6s ease 0.5s both; }
    .intro-name { margin: 0; font-size: 18vmin; font-weight: 900; letter-spacing: -0.04em; line-height: 0.9; animation: intro-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s both; }
    @keyframes intro-glow { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1.1); opacity: 0.35; } }
    @keyframes intro-pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes intro-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes intro-rise { from { transform: translateY(6vmin); opacity: 0; clip-path: inset(100% 0 0 0); } to { transform: none; opacity: 1; clip-path: inset(0 0 0 0); } }
  </style>
  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
    <div id="intro-stage" class="clip intro-stage" data-start="0" data-duration="3">
      <div id="intro-glow" class="intro-glow"></div>
      <img id="intro-logo" class="intro-logo" src="assets/logo.svg" data-var-src="logo" alt="">
      <p id="intro-kicker" class="intro-kicker" data-var-text="kicker">Nuevo</p>
      <h1 id="intro-name" class="intro-name" data-var-text="product">Nova</h1>
    </div>
  </div>
</template>

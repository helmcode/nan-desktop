<template id="title-template">
  <style>
    @font-face { font-family: "Libre Franklin"; font-weight: 400; src: url("assets/fonts/libre-franklin-400.woff2") format("woff2"); }
    @font-face { font-family: "Libre Franklin"; font-weight: 600; src: url("assets/fonts/libre-franklin-600.woff2") format("woff2"); }
    @font-face { font-family: "Libre Baskerville"; font-weight: 700; src: url("assets/fonts/libre-baskerville-700.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Libre Franklin", system-ui, sans-serif; }
    .title-stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 4vmin; padding: 0 12vmin; }
    .title-sun { position: absolute; right: -18vmin; top: 50%; width: 80vmin; height: 80vmin; margin-top: -40vmin; border-radius: 50%; border: 0.5vmin solid var(--accent); opacity: 0.5; animation: title-sun 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .title-sun-inner { position: absolute; inset: 14vmin; border-radius: 50%; background: var(--accent); opacity: 0.18; }
    .title-head { position: relative; display: flex; align-items: center; gap: 2.5vmin; animation: title-fade 0.6s ease 0.2s both; }
    .title-logo { width: 7vmin; height: 7vmin; object-fit: contain; }
    .title-kicker { margin: 0; font-size: 3vmin; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .title-name { position: relative; margin: 0; max-width: 120vmin; font-family: "Libre Baskerville", serif; font-size: 10.5vmin; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; animation: title-rise 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s both; }
    .title-sub { position: relative; margin: 0; max-width: 110vmin; font-size: 4.2vmin; font-weight: 400; line-height: 1.3; opacity: 0.85; animation: title-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1s both; }
    @keyframes title-sun { from { opacity: 0; transform: scale(0.6) translateX(20vmin); } to { opacity: 0.5; transform: none; } }
    @keyframes title-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes title-rise { from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(5vmin); } to { opacity: 1; clip-path: inset(0 0 -10% 0); transform: none; } }
    @keyframes title-up { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 0.85; transform: none; } }
    @media (max-aspect-ratio: 3/4) {
      .title-stage { padding: 0 7vmin; }
      .title-name { font-size: 9.5vmin; max-width: 86vmin; }
      .title-sub { font-size: 4vmin; max-width: 86vmin; }
      .title-sun { right: -26vmin; top: auto; bottom: -30vmin; margin-top: 0; width: 64vmin; height: 64vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .title-name { font-size: 11vmin; }
      .title-sub { font-size: 4.8vmin; }
      .title-kicker { font-size: 3.4vmin; }
      .title-sun { bottom: -12vmin; width: 80vmin; height: 80vmin; }
    }
  </style>
  <div id="root" data-composition-id="title" data-width="1920" data-height="1080">
    <div id="title-stage" class="clip title-stage" data-start="0" data-duration="3.5">
      <div id="title-sun" class="title-sun"><div class="title-sun-inner"></div></div>
      <div id="title-head" class="title-head">
        <img id="title-logo" class="title-logo" src="assets/logo.svg" data-var-src="logo" alt="">
        <p id="title-kicker" class="title-kicker" data-var-text="kicker">Encuentro anual · 3.ª edición</p>
      </div>
      <h1 id="title-name" class="title-name" data-var-text="event">Jornada de Diseño Abierto</h1>
      <p id="title-sub" class="title-sub" data-var-text="subtitle">Un día para aprender, construir y conocerse</p>
    </div>
  </div>
</template>

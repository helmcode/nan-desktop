<template id="details-template">
  <style>
    @font-face { font-family: "Libre Franklin"; font-weight: 400; src: url("assets/fonts/libre-franklin-400.woff2") format("woff2"); }
    @font-face { font-family: "Libre Franklin"; font-weight: 600; src: url("assets/fonts/libre-franklin-600.woff2") format("woff2"); }
    @font-face { font-family: "Libre Baskerville"; font-weight: 700; src: url("assets/fonts/libre-baskerville-700.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Libre Franklin", system-ui, sans-serif; }
    .details-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 10vmin; }
    .details-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5vmin; width: 100%; }
    .details-item { display: flex; flex-direction: column; gap: 2.5vmin; padding-top: 3vmin; border-top: 0.5vmin solid var(--accent); animation: details-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .details-item:nth-child(2) { animation-delay: 0.35s; }
    .details-item:nth-child(3) { animation-delay: 0.7s; }
    .details-label { font-size: 2.8vmin; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .details-value { font-family: "Libre Baskerville", serif; font-size: 5.6vmin; font-weight: 700; line-height: 1.15; }
    .details-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 1vmin; background: var(--accent); transform-origin: left center; animation: details-bar 4.5s linear both; }
    @keyframes details-in { from { opacity: 0; transform: translateY(6vmin); } to { opacity: 1; transform: none; } }
    @keyframes details-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (max-aspect-ratio: 3/4) {
      .details-stage { padding: 0 8vmin; }
      .details-list { grid-template-columns: 1fr; gap: 4vmin; }
      .details-item { flex-direction: row; align-items: baseline; gap: 3vmin; padding-top: 2.4vmin; }
      .details-label { flex: none; width: 18vmin; font-size: 2.6vmin; }
      .details-value { font-size: 5.6vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .details-list { gap: 7vmin; }
      .details-item { flex-direction: column; gap: 2vmin; padding-top: 3vmin; }
      .details-label { width: auto; font-size: 3.4vmin; }
      .details-value { font-size: 7.5vmin; }
    }
  </style>
  <div id="root" data-composition-id="details" data-width="1920" data-height="1080">
    <div id="details-stage" class="clip details-stage" data-start="0" data-duration="4.5">
      <div id="details-list" class="details-list">
        <div id="details-date" class="details-item"><span class="details-label" data-var-text="label-date">Fecha</span><span class="details-value" data-var-text="date">Jueves 14 de mayo</span></div>
        <div id="details-time" class="details-item"><span class="details-label" data-var-text="label-time">Hora</span><span class="details-value" data-var-text="time">De 9:30 a 18:00</span></div>
        <div id="details-place" class="details-item"><span class="details-label" data-var-text="label-place">Lugar</span><span class="details-value" data-var-text="place">Auditorio Faro, Valencia</span></div>
      </div>
      <div id="details-bar" class="details-bar"></div>
    </div>
  </div>
</template>

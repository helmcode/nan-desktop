<template id="quote-template">
  <style>
    @font-face { font-family: "Libre Franklin"; font-weight: 400; src: url("assets/fonts/libre-franklin-400.woff2") format("woff2"); }
    @font-face { font-family: "Libre Franklin"; font-weight: 600; src: url("assets/fonts/libre-franklin-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Libre Franklin", system-ui, sans-serif; }
    .quote-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 7vmin; }
    .quote-card { position: relative; display: flex; flex-direction: column; gap: 4vmin; width: 100%; max-width: 150vmin; padding: 8vmin 9vmin; border-radius: 3vmin; background: var(--card); box-shadow: 0 3vmin 8vmin rgba(0, 0, 0, 0.12); animation: quote-card 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both, quote-drift 5.6s linear 0.9s both; }
    .quote-mark { position: absolute; top: -9vmin; left: 6vmin; font-family: "Playfair Display", serif; font-size: 30vmin; font-weight: 700; line-height: 1; color: var(--accent); animation: quote-mark 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.4s both; }
    .quote-stars { position: relative; display: flex; gap: 1.4vmin; }
    .quote-star { width: 4.4vmin; height: 4.4vmin; background: var(--accent); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: quote-star 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.5) both; }
    .quote-star:nth-child(1) { animation-delay: 0.8s; }
    .quote-star:nth-child(2) { animation-delay: 0.9s; }
    .quote-star:nth-child(3) { animation-delay: 1s; }
    .quote-star:nth-child(4) { animation-delay: 1.1s; }
    .quote-star:nth-child(5) { animation-delay: 1.2s; }
    .quote-text { position: relative; margin: 0; font-family: "Playfair Display", serif; font-size: 6.4vmin; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; animation: quote-reveal 1.4s cubic-bezier(0.3, 0.7, 0.2, 1) 1.1s both; }
    .quote-author { position: relative; display: flex; align-items: center; gap: 3vmin; padding-top: 4vmin; border-top: 0.3vmin solid rgba(0, 0, 0, 0.12); animation: quote-up 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 2.8s both; }
    .quote-avatar { flex: none; display: flex; align-items: center; justify-content: center; width: 11vmin; height: 11vmin; border-radius: 50%; background: var(--fg); color: var(--card); font-size: 4vmin; font-weight: 600; letter-spacing: 0.04em; }
    .quote-who { display: flex; flex-direction: column; gap: 0.8vmin; min-width: 0; }
    .quote-name { font-size: 4.2vmin; font-weight: 600; }
    .quote-role { font-size: 3.1vmin; font-weight: 400; opacity: 0.7; }
    @keyframes quote-card { from { opacity: 0; transform: translateY(8vmin) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes quote-drift { from { translate: 0 0; } to { translate: 0 -1.5vmin; } }
    @keyframes quote-mark { from { opacity: 0; transform: scale(0.3) rotate(-20deg); } to { opacity: 1; transform: none; } }
    @keyframes quote-star { from { opacity: 0; transform: scale(0) rotate(-72deg); } to { opacity: 1; transform: none; } }
    @keyframes quote-reveal { from { opacity: 0.2; clip-path: inset(0 0 100% 0); transform: translateY(2vmin); } to { opacity: 1; clip-path: inset(0 0 -10% 0); transform: none; } }
    @keyframes quote-up { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 1; transform: none; } }
    @media (max-aspect-ratio: 3/4) {
      .quote-card { padding: 9vmin 7vmin 7vmin; gap: 3.5vmin; }
      .quote-mark { top: -8vmin; left: 5vmin; font-size: 26vmin; }
      .quote-text { font-size: 5.6vmin; }
      .quote-avatar { width: 10vmin; height: 10vmin; font-size: 3.6vmin; }
      .quote-name { font-size: 3.8vmin; }
      .quote-role { font-size: 2.9vmin; }
    }
    @media (max-aspect-ratio: 3/4) {
      .quote-card { gap: 5vmin; padding: 11vmin 7vmin 8vmin; }
      .quote-text { font-size: 8vmin; }
      .quote-star { width: 6vmin; height: 6vmin; }
      .quote-name { font-size: 4.8vmin; }
      .quote-role { font-size: 3.6vmin; }
      .quote-avatar { width: 13vmin; height: 13vmin; font-size: 4.6vmin; }
    }
  </style>
  <div id="root" data-composition-id="quote" data-width="1920" data-height="1080">
    <div id="quote-stage" class="clip quote-stage" data-start="0" data-duration="6.5">
      <div id="quote-card" class="quote-card">
        <span id="quote-mark" class="quote-mark">“</span>
        <div id="quote-stars" class="quote-stars"><span class="quote-star"></span><span class="quote-star"></span><span class="quote-star"></span><span class="quote-star"></span><span class="quote-star"></span></div>
        <p id="quote-text" class="quote-text" data-var-text="quote">En dos semanas pasamos de perseguir correos a tener todo el equipo en la misma página.</p>
        <div id="quote-author" class="quote-author">
          <span id="quote-avatar" class="quote-avatar" data-var-text="initials">LG</span>
          <div id="quote-who" class="quote-who">
            <span id="quote-name" class="quote-name" data-var-text="name">Laura Gómez</span>
            <span id="quote-role" class="quote-role" data-var-text="role">Directora de operaciones, Estudio Faro</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

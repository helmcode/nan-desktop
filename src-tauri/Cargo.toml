[package]
name = "nan-desktop"
version = "0.1.0"
description = "nan-desktop — native desktop app for the NaN and Helmcode inference platforms (Tauri v2, zero telemetry)"
authors = ["Helmcode S.L."]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# T8: native folder picker for tools folder grants (capability dialog:allow-open —
# the picker is the only dialog use, so no broader dialog permission).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["time"] }
# Native audio playback (T6, S5): rodio with only the wav decoder enabled —
# kokoro is requested as `response_format: "wav"` so no mp3/ogg/flac decoder
# dependency is pulled in. `playback` is the cpal output stream itself.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
# Inline image generation (T5, S5): uuid v4 file names for the saved PNGs and
# base64 decoding of the OpenAI images `b64_json` reply. Both are already in
# the dependency tree transitively (tauri uses uuid; reqwest/tauri use base64).
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# T8 run_command (S7): SIGKILL the child's whole process GROUP on timeout so
# forked grandchildren cannot keep the pipes open past the kill. Already in
# the dependency tree transitively (tokio/mio); unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

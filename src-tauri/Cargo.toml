[package]
name = "nan-desktop"
version = "0.2.6"
description = "nan-desktop — native desktop app for the NaN and Helmcode inference platforms (Tauri v2, zero telemetry)"
authors = ["Helmcode S.L."]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# S24: the voice UI (mic dictation + read-aloud buttons) is parked. Default
# OFF; `app_info().voice_ui` reports it so the renderer hides the controls.
# The voice code itself (stt.rs / tts.rs and their commands) stays compiled.
voice-ui = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# T8: native folder picker for tools folder grants (capability dialog:allow-open —
# the picker is the only dialog use, so no broader dialog permission).
tauri-plugin-dialog = "2"
# Round 7: signed auto-update (minisign-verified against the pubkey in
# tauri.conf.json). Driven only by the core's update_check/update_install.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
# `sync`: oneshot channels for the inline approval broker (S14).
tokio = { version = "1", features = ["time", "sync"] }
# Native audio playback (T6, S5): rodio with only the wav decoder enabled —
# kokoro is requested as `response_format: "wav"` so no mp3/ogg/flac decoder
# dependency is pulled in. `playback` is the cpal output stream itself.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
# Credential vault (round 5): every secret lives in ONE AES-256-GCM encrypted
# file; only its 32-byte master key touches the OS keychain (release builds).
# `getrandom` supplies the master key and the per-write nonces from the OS
# CSPRNG. See `credentials.rs` and SECURITY.md.
aes-gcm = "0.10"
getrandom = "0.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
# Inline image generation (T5, S5): uuid v4 file names for the saved PNGs and
# base64 decoding of the OpenAI images `b64_json` reply. Both are already in
# the dependency tree transitively (tauri uses uuid; reqwest/tauri use base64).
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
# Local skills (T14/S1): NFC checks on bundle paths and accent folding for
# the generated skill name. Already in the tree transitively (url -> idna).
icu_normalizer = "2"
# Shared skills (S4): content hash of a bundle (share link + the offline
# cache file name). Already in the tree transitively.
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# T8 run_command (S7): SIGKILL the child's whole process GROUP on timeout so
# forked grandchildren cannot keep the pipes open past the kill. Already in
# the dependency tree transitively (tokio/mio); unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

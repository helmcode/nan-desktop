[package]
name = "nan-desktop"
version = "0.2.18"
description = "nan-desktop — native desktop app for the NaN and Helmcode inference platforms (Tauri v2, no third parties)"
authors = ["Helmcode S.L."]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# S24: the voice UI (mic dictation + read-aloud buttons) is parked. Default
# OFF; `app_info().voice_ui` reports it so the renderer hides the controls.
# The voice code itself (stt.rs / tts.rs and their commands) stays compiled.
voice-ui = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# T8: native folder picker for tools folder grants (capability dialog:allow-open —
# the picker is the only dialog use, so no broader dialog permission).
tauri-plugin-dialog = "2"
# Round 7: signed auto-update (minisign-verified against the pubkey in
# tauri.conf.json). Driven only by the core's update_check/update_install.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
# `sync`: oneshot channels for the inline approval broker (S14).
tokio = { version = "1", features = ["time", "sync"] }
# Native audio playback (T6, S5): rodio with only the wav decoder enabled —
# kokoro is requested as `response_format: "wav"` so no mp3/ogg/flac decoder
# dependency is pulled in. `playback` is the cpal output stream itself.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
# Credential vault (round 5): every secret lives in ONE AES-256-GCM encrypted
# file; only its 32-byte master key touches the OS keychain (release builds).
# `getrandom` supplies the master key and the per-write nonces from the OS
# CSPRNG. See `credentials.rs` and SECURITY.md.
aes-gcm = "0.11"
getrandom = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
# Inline image generation (T5, S5): uuid v4 file names for the saved PNGs and
# base64 decoding of the OpenAI images `b64_json` reply. Both are already in
# the dependency tree transitively (tauri uses uuid; reqwest/tauri use base64).
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
# Local skills (T14/S1): NFC checks on bundle paths and accent folding for
# the generated skill name. Already in the tree transitively (url -> idna).
icu_normalizer = "2"
# Shared skills (S4): content hash of a bundle (share link + the offline
# cache file name). Already in the tree transitively.
sha2 = "0.11"
# R-V1: CRC-32 of the stored zip the video export uploads (the bundle is
# written by hand: deterministic, no compression). Already in the tree
# transitively (flate2/png).
crc32fast = "1"
# Chat attachments (vision): decode PNG/JPEG/WebP/GIF (first frame), downscale
# to the long-side cap and re-encode as JPEG before an image is sent to the
# model. Pure Rust codecs only; no default features (no TIFF/AVIF/EXR...).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# T8 run_command (S7): SIGKILL the child's whole process GROUP on timeout so
# forked grandchildren cannot keep the pipes open past the kill. Already in
# the dependency tree transitively (tokio/mio); unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# In-app browser screenshots (`src/browser/screenshot.rs`): each engine's
# own snapshot API. All already in the dependency tree through wry; only the
# features the snapshot needs are enabled here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
tempfile = "3.27.0"
# R-V1: reads back the hand-written export zip in tests (already in the
# lock file through the updater).
zip = { version = "9", default-features = false }
